    <script>
        function showSection(sectionId) {
            var sections = ['dashboard-section', 'users-section', 'courses-section', 'settings-section'];
            sections.forEach(function(id) {
                var element = document.getElementById(id);
                if (element) {
                    element.classList.add('hidden');
                }
            });

            var selectedSection = document.getElementById(sectionId);
            if (selectedSection) {
                selectedSection.classList.remove('hidden');
            }

            var titleMap = {
                'dashboard-section': 'Dashboard',
                'users-section': 'User Management',
                'courses-section': 'Course Management',
                'settings-section': 'Settings'
            };

            var titleElement = document.getElementById('page-title');
            if (titleElement && titleMap[sectionId]) {
                titleElement.textContent = titleMap[sectionId];
            }
        }
    </script>
